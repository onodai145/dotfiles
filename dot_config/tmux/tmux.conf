#set-option -g status-left-length 90
#set-option -g status-right-length 90
#set-option -g status-left '#H:[#P]'
#set-option -g status-right 'CPU: #{cpu_icon} #{cpu_percentage} RAM: #{ram_icon} #{ram_percentage} GPU: #{gpu_icon} #{gpu_percentage} | [%Y-%m-%d(%a) %H:%M:%S] #{forecast}'
set-option -g status-interval 1
#set-option -g status-justify centre
set-option -g mouse on
set-option -g default-shell /usr/bin/zsh
set-option -g status-position top
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",$TERM:Tc"

set-window-option -g mode-keys vi

set -g mouse on
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# List of plugins
#set -g @plugin 'seebi/tmux-colors-solarized'
set -g @plugin 'fabioluciano/tmux-powerkit'
#set -g @plugin "janoamaral/tokyo-night-tmux"
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'aaronpowell/tmux-weather'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'cutbypham/tmux-fzf-session-switch'

# theme
set -g @powerkit_plugins ""
set -g @powerkit_theme "tokyo-night"
set -g @powerkit_theme_variant "night"
set -g @powerkit_transparent "true"

# weather
set -g @forecast-location Tokyo
set -g @forecast-format '%c'+'%t'
set -g @forecast-cache-duration 900

# restore
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# run '/usr/share/tmux-plugin-manager/tpm'
if-shell 'command -v tpack >/dev/null 2>&1' {
    run-shell 'tpack'
} {
    if-shell '[ -f /usr/share/tmux-plugin-manager/tpm ]' {
        run-shell '/usr/share/tmux-plugin-manager/tpm'
    } {
        if-shell '[ -f /opt/homebrew/opt/tpm/share/tpm/tpm ]' {
            run-shell '/opt/homebrew/opt/tpm/share/tpm/tpm'
        } {
            if-shell '[ -f ~/.config/tmux/plugins/tpm/tpm ]' {
                run-shell '~/.config/tmux/plugins/tpm/tpm'
            }
        }
    }
}
