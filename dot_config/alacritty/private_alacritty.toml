[env]
TERM = "xterm-256color"
[window]
opacity = 0.8
[font]
size = 14
[font.normal]
family = "Cica"
[font.bold]
family = "Cica"
style = "Bold"
[font.italic]
family = "Cica"
style = "Italic"
[font.bold_italic]
family = "Cica"
style = "Bold Italic"

[general]
live_config_reload = true
import = [
    "~/.config/alacritty/themes/themes/tokyo_night.toml"
]

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001b[13;2u"
